# Triplet MQTT broker (Mosquitto 2). Started by `docker compose up broker` (repo root).
# TLS only, one account per layer, topic ACL. Secrets come from brain/secrets/ (python tools/setup.py).

allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl

# MQTT over TLS (SEC-1): the only listener
listener 8883
cafile /mosquitto/secrets/ca.crt
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
tls_version tlsv1.2
require_certificate false          # mTLS: set true and give every layer a client certificate

# Retained state (city description, verdicts, quarantines, statuses) is rebuilt by the layers on
# connect; no persistence, so a demo always starts clean.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
max_inflight_messages 100
max_queued_messages 1000
