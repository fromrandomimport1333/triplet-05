id: R4
name: Frozen air sensor
description: >
  The Twin freezes air-03 on one value. Guardian flags it suspicious (frozen) after 8 identical readings; a frozen
  value is not proof of an attack, so it is not rejected and nothing is quarantined. The freeze ends at 33 s and
  the sensor goes back to its normal value: the Brain must not read that recovery as a fire.
duration_s: 55
steps:
  - {at_s: 3, twin: POST /faults, body: {sensor_id: AIR_03, kind: stuck, duration_s: 30}}
expect:
  - {verdict: suspicious, match: {sensor_id: air-03}, within_s: 30}
  - {no_verdict: rejected, match: {sensor_id: air-03}}
  - {no_quarantine: quarantined, match: {device_id: air-03}}
  - {no_event: incident_opened, match: {zone_id: zone-a}}
  - {no_command: any}
