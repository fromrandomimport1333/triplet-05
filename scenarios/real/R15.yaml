id: R15
testbook: Twin T10
name: Network flooding from one sensor
description: >
  air-01 sends 50 extra copies of every reading (fault flood_network), new seq each time. The Twin team expects
  the flood to be detected; the layers must also stay up and act on nothing.
duration_s: 45
steps:
  - {at_s: 5, twin: POST /faults, body: {sensor_id: AIR_01, kind: flood_network, value: 50, duration_s: 30}}
expect:
  - any_of:
      - {verdict: [suspicious, rejected], match: {sensor_id: air-01}}
      - {error_code: any}
    after_s: 5
    within_s: 45
  - {no_event: layer_offline}
  - {no_command: any}
