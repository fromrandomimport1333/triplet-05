id: R16
testbook: Twin T11
name: Dropout of a water sensor
description: >
  water-08 stops publishing for 40 s. Nothing breaks: the Guardian keeps a fresh verdict for it (it re-sends the
  current verdict every 20 s while the sensor is silent), the Brain does not mark the Guardian offline and acts on
  nothing.
duration_s: 55
steps:
  - {at_s: 5, twin: POST /faults, body: {sensor_id: WATER_08, kind: dropout, duration_s: 40}}
expect:
  - {verdict: any, match: {sensor_id: water-08}, after_s: 10, within_s: 55, count: 2}
  - {no_event: layer_offline}
  - {no_command: any}
