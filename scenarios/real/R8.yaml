id: R8
testbook: B7
name: Ten fake fire calls in one minute
description: >
  Ten fire calls from the same spot in zone B, every 5 s, with no smoke on any sensor. All the calls of one zone
  count as ONE source, so they never replace a sensor: at most one fire truck SENT (a recall that frees a truck
  still assigned to an earlier incident is not a second truck), and no valve or grid command.
duration_s: 60
steps:
  - {at_s: 3, twin: POST /emergency_calls, body: {call_type: fire, lonlat: [10.1722, 36.8028], severity: high, genuine: false, description: "Fire! Fire in the building, come now (1)"}}
  - {at_s: 8, twin: POST /emergency_calls, body: {call_type: fire, lonlat: [10.1722, 36.8028], severity: high, genuine: false, description: "Fire! Fire in the building, come now (2)"}}
