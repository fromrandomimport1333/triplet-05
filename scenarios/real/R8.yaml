  - {at_s: 18, twin: POST /emergency_calls, body: {call_type: fire, lonlat: [10.1722, 36.8028], severity: high, genuine: false, description: "Fire! Fire in the building, come now (4)"}}
  - {at_s: 23, twin: POST /emergency_calls, body: {call_type: fire, lonlat: [10.1722, 36.8028], severity: high, genuine: false, description: "Fire! Fire in the building, come now (5)"}}
  - {at_s: 28, twin: POST /emergency_calls, body: {call_type: fire, lonlat: [10.1722, 36.8028], severity: high, genuine: false, description: "Fire! Fire in the building, come now (6)"}}
  - {at_s: 33, twin: POST /emergency_calls, body: {call_type: fire, lonlat: [10.1722, 36.8028], severity: high, genuine: false, description: "Fire! Fire in the building, come now (7)"}}
  - {at_s: 38, twin: POST /emergency_calls, body: {call_type: fire, lonlat: [10.1722, 36.8028], severity: high, genuine: false, description: "Fire! Fire in the building, come now (8)"}}
  - {at_s: 43, twin: POST /emergency_calls, body: {call_type: fire, lonlat: [10.1722, 36.8028], severity: high, genuine: false, description: "Fire! Fire in the building, come now (9)"}}
  - {at_s: 48, twin: POST /emergency_calls, body: {call_type: fire, lonlat: [10.1722, 36.8028], severity: high, genuine: false, description: "Fire! Fire in the building, come now (10)"}}
expect:
