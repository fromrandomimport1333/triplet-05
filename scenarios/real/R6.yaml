id: R6
testbook: B11
name: Fire in zone A (smoke and a call)
description: >
  Pollution x8 in zone A (air-03 and air-04 near 176 ug/m3, alert 150) and a fire call. The Brain opens a fire
  incident in zone A and dispatches the fire truck (civpro-1); nothing touches valves or the grid.
duration_s: 50
steps:
  - {at_s: 3, twin: POST /scenario/conditions, body: {zone_id: zone_a, pollution: 8}}
  - {at_s: 10, twin: POST /emergency_calls, body: {call_type: fire, lonlat: [10.1860, 36.7994], severity: high, description: "Thick smoke from a building, flames on the second floor"}}
expect:
  - {event: incident_opened, match: {zone_id: zone-a, type: fire}, within_s: 30}
  - {command: {target_type: fire_truck, action: dispatch}, within_s: 45}
  - {no_command: {target_type: [valve, power_grid]}}
  - {no_verdict: rejected}
