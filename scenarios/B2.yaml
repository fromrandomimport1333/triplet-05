id: B2
name: Real flood at the port
layers: [twin, guardian, brain]
description: >
  The water level at the port (zone-01, water-01) rises from 0.4 m to over 1.3 m and keeps rising.
  The Brain opens an incident, opens valve-01, the Twin acknowledges, the rain stops at 45 s, the
  water falls and the incident is closed.
trigger: python scenarios/run.py B2
expected:
  twin: water-01 above 1.3 m from about 6 s, rising 0.15 m/s; valve-01 acknowledges `done` and lowers the level by 0.3 m; back to normal after 45 s.
  guardian: water-01 trusted all along (a real, noisy rise).
  brain: Flood incident in zone-01, command valve-01 open, acknowledged; incident closed once the water is back below the alert.
how_to_verify: >
  Timeline: reading -> trusted verdict -> incident opened -> decision -> command valve-01 open ->
  ack -> incident closed. logs/B2-*.log holds the same chain and a PASS summary.
duration_s: 80
observe: {readings: [water-01]}
twin:
  reset: {seed: 7, scenario: flood, scenario_zone: zone-01, scenario_after_ticks: 5}
  actions:
    - {at_s: 45, op: trigger, scenario: calm, zone: zone-01}
guardian: {modes: [auto]}
expect:
  - {verdict: trusted, match: {sensor_id: water-01}, after_s: 6}
  - {no_verdict: rejected, match: {sensor_id: water-01}}
  - {event: incident_opened, match: {zone_id: zone-01, type: flood}, within_s: 20}
  - {command: {target_id: valve-01, action: open}, within_s: 30}
  - {ack: done, match: {actuator_id: valve-01}, within_s: 35}
  - {outcome: acknowledged, match: {target_id: valve-01}, within_s: 40}
  - {reading: water-01, match: {value: {lt: 1.0}}, after_s: 46, within_s: 60}
  - {event: incident_closed, match: {zone_id: zone-01, type: flood}, after_s: 45, within_s: 80}
  - {no_error_code: any}
