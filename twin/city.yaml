# Twin configuration. Everything that depends on WHERE or WHICH device lives here, not in code.
# Edit this file, restart twin.py, and the markers/sensors/actuators move.

sumo:
  # Path to the scenario generated by the OSM Web Wizard (relative to this file).
  cfg: sumo/tunis/osm.sumocfg
  gui: true            # true = sumo-gui window, false = headless
  step_length: 1.0     # simulated seconds per step

mqtt:
  host: 127.0.0.1      # not "localhost": on Windows that name costs about 2 s per connection (IPv6 tried first)
  port: 1883
  # username: twin        # uncomment once Mosquitto requires a login
  # password: change-me
  # topics: city/<zone>/<kind>/<sensor_id>  and  city/<zone>/actuator/<id>/state

api:
  host: 0.0.0.0
  port: 8000
  # DEVELOPMENT KEYS ONLY. For anything real, set them in the environment instead (they override this file):
  #   TWIN_API_KEY, TWIN_GUARDIAN_KEY, TWIN_TEST_KEY, TSYP_HMAC_KEY   (see .env.example at the repository root)
  # One key per layer (header X-API-Key), least privilege:
  api_key: change-me                # the Brain: command actuators, read actuator state and emergency calls
  guardian_key: guardian-twin-key   # the Guardian: ONLY quarantine / release a device (POST/DELETE /quarantine/<id>)
  test_key: test-key                # test scripts: faults, conditions, reset, emergency calls, /truth, /events
  hmac_key: change-me-too     # readings are signed with HMAC-SHA256 using this key

publish_every_s: 1.0           # sensor publish period (simulated seconds)
# Per-kind period, overriding publish_every_s. The Phase 0 report (Table 1) gives air quality 0.2 Hz (5 s); it is kept
# at 1 s here so that a stuck or spoofed air sensor is flagged within seconds. Uncomment to follow Table 1 exactly:
publish_every_s_by_kind: {}
#  air_quality: 5

schemas_dir: ../docs/schemas   # JSON Schemas used to validate incoming commands (relative to this file)

# Emergency units for dispatch_emergency(type, zone_id). ETA = route length / speed_kmh. With SUMO the route comes from
# the road network; in --fake mode it is the straight-line distance x road_factor. A unit is busy until it has
# arrived and spent on_scene_s at the scene.
dispatch:
  speed_kmh: 40
  road_factor: 1.3
  on_scene_s: 120
  units:
    - {id: POLICE_1,  type: police,           lonlat: [10.17420, 36.79960]}   # near Bab Bhar
    - {id: POLICE_2,  type: police,           lonlat: [10.19100, 36.80300]}
    - {id: AMBU_1,    type: ambulance,        lonlat: [10.16700, 36.80200]}   # towards Charles Nicolle hospital
    - {id: AMBU_2,    type: ambulance,        lonlat: [10.18600, 36.79700]}
    - {id: CIVPRO_1,  type: civil_protection, lonlat: [10.18900, 36.80700]}

logs:
  dir: logs            # relative to this file
  rotate_mb: 20        # start a new twin_events.json when it reaches this size
  keep_files: 5        # twin_events files kept, counting the active one; older ones are deleted

# source:  sumo  = read from the SUMO simulation
