# ---------------------------------------------------------------------------------------------------------------
# City Brain protocol profile: talk to the REAL Brain and Guardian (MQTT over TLS, signed envelopes). Off by default:
# the Twin then runs alone, exactly as before (native broker above, REST API, our stand-ins in mocks/).
# Switch on with enabled: true or INTEGRATION_ENABLED=1. Environment overrides: see contract.py (INTEGRATION_ENV).
# Paths are relative to this file. Secrets (CA, password, keys) come from the Brain team, never from git.
# ---------------------------------------------------------------------------------------------------------------
integration:
  enabled: false
  disable_native_mqtt: true       # when on, do not also publish the native messages on the broker above
  mqtt:
    host: 127.0.0.1               # the Brain laptop's LAN IP at the joint run (PARTNER_MQTT_HOST)
    port: 8883
    tls: true
    ca_cert: ../secrets/ca.crt
    username: twin
    password_file: ../secrets/twin-password.txt
    client_id: ""                 # empty = twin-<run id>; must be unique on the broker
    keepalive_s: 30
  keys:                           # one HMAC key per pair of layers; the file text is the key (not hex-decoded)
    brain: ../secrets/keys/twin-brain.key
    guardian: ../secrets/keys/twin-guardian.key   # to agree with the Guardian team (also used to verify quarantine notices)
  clock_window_s: 10              # accepted clock skew on Brain commands
  qos_readings: 0                 # readings QoS 0 as in the Brain card; meta, calls, acks, status always use 1
  run_id: ""                      # empty = tw<start time>: ids stay unique across restarts (no false replay)

  # Names. Partners accept only [a-z0-9][a-z0-9-]*: default is lower-case and "_" -> "-" (CAM_01 -> cam-01).
  # id_map overrides one id, e.g. {WATER_07: water-01, zone_a: zone-01}.
  id_map: {}
  # Zone details the Brain uses for priorities (type/exposure); adjacency defaults to "every other zone".
  zones:
    zone_a: {name: "Centre east", type: commercial, exposure: medium}
    zone_b: {name: "Centre west", type: residential, exposure: medium}

  # Which Twin sensors become which partner sensors. Value = the Twin field (default "value"), scale = multiplier.
  # expose: false hides a family. min/max are the physical range declared in twin/meta (readings outside = E_RANGE).
  sensors:
    traffic_camera:
      - {type: traffic_speed, unit: "km/h", field: mean_speed_kmh, id_suffix: speed, min: 0, max: 200}
      # traffic_density (vehicles/km) and traffic_flow (vehicles/min) are not exposed: the Twin has no road length in
      # --fake mode and no flow count (MATCHING.md Q3).
    water_level:
      - {type: water_level, unit: m, min: 0, max: 6, alert: 1.3}      # alert 1.3 m = the Brain mock's value (MATCHING.md Q4)
    air_quality:
      - {type: air_quality, unit: "ug/m3", min: 0, max: 1000, alert: 150}
    power_load:                    # the Twin reports % of feeder capacity; partners want kW
      - {type: power_load, unit: kW, scale: 10.0, min: 0, max: 1100}   # scale = capacity_kw / 100 ; capacity_kw 1000 is a PLACEHOLDER
    rain:
      - {expose: false}            # no Brain rule, no Guardian unit for it (MATCHING.md Q7)

  # Actuators declared in twin/meta. `map` turns the Brain's action into the Twin's native args. road_closure and
  # public_alert are not declared: the Brain has no playbook that uses them (MATCHING.md R-B2).
  actuators:
    water_valve:    {type: valve, actions: [open, close], map: {open: {state: open}, close: {state: closed}}}
    traffic_signal: {type: traffic_signal, actions: [normal, priority], map: {normal: {phase: 0}, priority: {phase: 2}}}
    power_grid:     {type: power_grid, actions: [normal, shed], map: {normal: {action: normal}, shed: {action: shed}}}
  # Twin unit type -> type name declared to the Brain (its rules look for fire_truck, rescue, ambulance, police).
  unit_types: {civil_protection: fire_truck}
  # Emergency call type -> category of the Brain (fire, accident, flood, medical, other).
  call_categories: {medical: medical, accident: accident, crime: other, fire: fire, flood: flood}
